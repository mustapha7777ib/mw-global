# Netlify build configuration.
#
# Next.js needs a server runtime here, not a static export — the site has a
# server route at /api/quote. Netlify's Next.js runtime handles this; it is
# auto-detected, but declaring it explicitly avoids surprises.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers. Safe defaults for a marketing site — the frame-ancestors
# rule stops the site being embedded in someone else's page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Photographs are content-hashed by the build; cache them hard.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
